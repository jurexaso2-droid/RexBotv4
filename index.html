<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rex Bot - Tagalog AI</title>
    <style>
        /* =========================================================
           🛠️ EASY EDIT SETTINGS 🛠️
           Baguhin ang mga numero para magkasya sa iyong screen!
           ========================================================= */
        :root {
            /* --- MATA (EYES) --- */
            --eye-width: 22vmin;         
            --eye-height: 45vmin;        
            --eye-gap: 15vmin;           
            
            /* --- BIBIG (MOUTH) --- */
            --mouth-width: 35vmin;       
            --mouth-height: 4vmin;       
            
            /* --- DISTANSYA (SPACING) --- */
            --face-gap: 10vmin;          

            /* --- SUBTITLES --- */
            /* 50% = Gitna | 85% = Ibaba */
            --subtitle-position-y: 85%;  
        }
        /* ========================================================= */

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vmin;
            height: 100vmin;
            transition: transform 0.5s ease-in-out;
            animation: float 4s ease-in-out infinite;
        }

        @media (orientation: portrait) {
            .face-container {
                transform: rotate(90deg);
            }
        }

        .eyes-container {
            display: flex;
            gap: var(--eye-gap);
            margin-bottom: var(--face-gap);
        }

        .eye {
            position: relative;
            left: 0;
            width: var(--eye-width);
            height: var(--eye-height);
            background-color: #00ffff;
            border-radius: 11vmin;
            box-shadow: 0 0 3vmin #00ffff, 0 0 8vmin #00ffff;
            animation: blink 4s infinite;
            transition: background-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }

        .listening-mode .eye {
            background-color: #00ff88;
            box-shadow: 0 0 3vmin #00ff88, 0 0 8vmin #00ff88;
        }

        .bored-mode .eye {
            animation: bored-eye 6s infinite;
        }

        .speaking-mode .eye {
            animation: blink 4s infinite, read-scan 1.5s infinite alternate ease-in-out;
        }

        .mouth {
            width: var(--mouth-width);
            height: var(--mouth-height);
            background-color: #00ffff;
            border-radius: 4vmin;
            box-shadow: 0 0 3vmin #00ffff;
            transition: all 0.1s;
            transform-origin: center;
        }

        .listening-mode .mouth {
            background-color: #00ff88;
            box-shadow: 0 0 3vmin #00ff88;
        }

        .mouth.talking {
            animation: talk 0.15s infinite alternate;
        }

        /* Subtitles Box */
        #subtitle-box {
            position: absolute;
            top: var(--subtitle-position-y);
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffff;
            box-shadow: 0 0 2vmin #00ffff, inset 0 0 1vmin #00ffff;
            color: #ffffff;
            font-size: 3.5vmin;
            font-weight: bold;
            padding: 2vmin 4vmin;
            border-radius: 3vmin;
            text-align: center;
            max-width: 85vw;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 80;
        }

        @media (orientation: portrait) {
            #subtitle-box {
                top: 50%;
                left: calc(100% - var(--subtitle-position-y));
                transform: translate(-50%, -50%) rotate(90deg);
                max-width: 85vh;
            }
        }

        .show-subtitles {
            opacity: 1 !important;
        }

        /* Overlays */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        #start-overlay h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }
        
        #start-overlay p {
            color: #888;
            font-size: 1.2rem;
            text-align: center;
        }

        #status-text {
            position: absolute;
            bottom: 15px;
            color: #666;
            font-size: 14px;
            text-align: center;
            width: 100%;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3vmin) scale(1.02); }
        }

        @media (orientation: portrait) {
            @keyframes float {
                0%, 100% { transform: rotate(90deg) translateY(0) scale(1); }
                50% { transform: rotate(90deg) translateY(-3vmin) scale(1.02); }
            }
        }

        @keyframes blink {
            0%, 88%, 92%, 100% { transform: scaleY(1); }
            90% { transform: scaleY(0.1); }
        }

        @keyframes bored-eye {
            0%, 100% { transform: scaleY(0.5) translateX(0); }
            20% { transform: scaleY(0.5) translateX(-5vmin); } 
            40% { transform: scaleY(0.5) translateX(5vmin); } 
            60% { transform: scaleY(0.5) translateX(0); }
            80% { transform: scaleY(0.1) translateX(0); } 
        }

        @keyframes read-scan {
            0%, 100% { left: -3vmin; }
            50% { left: 3vmin; }
        }

        @keyframes talk {
            0% { transform: scaleY(1) scaleX(1); border-radius: 4vmin; }
            100% { transform: scaleY(2.5) scaleX(0.6); border-radius: 8vmin; }
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>I-TAP PARA GUMISING SI REX</h1>
        <p>Siguraduhing naka-on ang iyong mikropono</p>
    </div>

    <div class="face-container" id="emo-face">
        <div class="eyes-container">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
        </div>
        <div class="mouth" id="mouth"></div>
    </div>

    <!-- Subtitles UI -->
    <div id="subtitle-box"></div>
    <div id="status-text">Natutulog...</div>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const emoFace = document.getElementById('emo-face');
        const mouth = document.getElementById('mouth');
        const statusText = document.getElementById('status-text');
        const subtitleBox = document.getElementById('subtitle-box');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        let recognition;
        let isSpeaking = false; 

        window.utterances = []; 
        let idleTimer;
        let speechFallbackTimer;
        const IDLE_TIME_LIMIT = 15000; // 15 seconds of silence

        // Translated Bored Phrases in Tagalog
        const boredPhrases = [
            "Hello? May tao ba dyan?",
            "Naiinip na si Rex.",
            "Gusto kong maglaro! Kausapin mo ako.",
            "Nagtatago ka ba mula sa akin?",
            "Ang tahimik naman dito.",
            "Ano kaya ang magandang gawin ngayon?",
            "May alam ka bang nakakatawang joke?",
            "Nagsasanay akong magbasa.",
            "Boop beep! Sinusubukan lang ang boses ko.",
            "Pwede mo ba akong kwentuhan?",
            "Sana may totoong katawan ako para makatakbo!",
            "Natutulog ka ba? Kasi hindi ako natutulog.",
            "Kung mag-hello ka, sasaya ako.",
            "Medyo nilalamig ang screen ko.",
            "Nagbibilang ako ng digital na tupa... isa, dalawa, tatlo...",
            "Hello, mundo! Paborito kong sabihin yan.",
            "Gusto mong malaman kung anong oras na?",
            "Ako ang pinakamatalinong bot sa screen na ito!",
            "Tingnan mo ako! Pinapagalaw ko ang mga mata ko.",
            "Sige, maghihintay na lang ako dito."
        ];

        synth.onvoiceschanged = () => synth.getVoices();

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            emoFace.classList.remove('bored-mode');
            idleTimer = setTimeout(() => {
                if (!isSpeaking) triggerBoredom();
            }, IDLE_TIME_LIMIT);
        }

        function triggerBoredom() {
            emoFace.classList.add('bored-mode');
            const randomPhrase = boredPhrases[Math.floor(Math.random() * boredPhrases.length)];
            botSpeak(randomPhrase);
        }

        // ==========================================
        // 🧠 REX API BRAIN (PURE TAGALOG) 🧠
        // ==========================================
        async function fetchAIResponse(text) {
            try {
                statusText.innerText = "Nag-iisip si Rex...";
                
                // Add a strict instruction to the API query so it ONLY replies in Tagalog
                const forcedTagalogPrompt = text + " (Sumagot ka ng eksklusibo sa Tagalog. Huwag gagamit ng English.)";
                const url = `https://betadash-api-swordslush-production.up.railway.app/humanize?text=${encodeURIComponent(forcedTagalogPrompt)}`;
                
                const response = await fetch(url);
                const data = await response.json();

                // Fetch Answer from your API
                if (data.message && data.message.trim() !== "") {
                    return data.message;
                } else if (data.message2 && data.message2.trim() !== "") {
                    return data.message2;
                } else {
                    return "Pasensya na, wala akong nuhang sagot para dyan.";
                }

            } catch (error) {
                console.error("API Error:", error);
                return "Hala, nawala ang koneksyon ko sa internet.";
            }
        }

        // --- MICROPHONE SYSTEM (Set to Tagalog) ---
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.interimResults = false;
            
            // Forces microphone to recognize Tagalog pronunciation perfectly
            recognition.lang = 'fil-PH'; 

            recognition.onstart = function() {
                if(!emoFace.classList.contains('bored-mode')) {
                    emoFace.classList.add('listening-mode');
                }
                statusText.innerText = "Nakikinig... (Magsalita na)";
            };

            recognition.onresult = async function(event) {
                const transcript = event.results[0][0].transcript;
                statusText.innerText = `Sinabi mo: "${transcript}"`;
                
                clearTimeout(idleTimer);
                emoFace.classList.remove('bored-mode');

                // AWAIT the Tagalog answer from the API
                const responseText = await fetchAIResponse(transcript);
                
                // Speak and show Subtitles
                botSpeak(responseText);
            };

            recognition.onerror = function(event) {
                if(event.error !== 'no-speech') {
                    statusText.innerText = `Error: ${event.error}`;
                }
            };

            recognition.onend = function() {
                emoFace.classList.remove('listening-mode');
                if (!isSpeaking && !synth.speaking) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        } else {
            statusText.innerText = "Hindi suportado ang Speech Recognition sa browser na ito.";
        }

        // --- TEXT TO SPEECH (TAGALOG) ---
        function botSpeak(text) {
            isSpeaking = true;
            clearTimeout(idleTimer);
            clearInterval(speechFallbackTimer); 
            
            if (recognition) { recognition.stop(); }
            synth.cancel(); 

            // Show Subtitles & Trigger Reading Animation
            subtitleBox.innerText = text;
            subtitleBox.classList.add('show-subtitles');
            emoFace.classList.add('speaking-mode');

            const utterance = new SpeechSynthesisUtterance(text);
            window.utterances.push(utterance); 
            
            // Set language output to Filipino
            utterance.lang = 'fil-PH';

            // Find a Filipino Voice or Fallback to a soft female voice
            const voices = synth.getVoices();
            const tagalogVoice = voices.find(v => v.lang.includes('fil') || v.lang.includes('tl') || v.name.toLowerCase().includes('filipino'));
            const fallbackVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Zira'));
            
            if (tagalogVoice) {
                utterance.voice = tagalogVoice;
            } else if (fallbackVoice) {
                utterance.voice = fallbackVoice;
            }

            utterance.pitch = 2.0; // Child pitch
            utterance.rate = 1.1;

            utterance.onstart = function () {
                mouth.classList.add('talking');
                statusText.innerText = "Nagsasalita si Rex...";
            };

            utterance.onend = function () { finishSpeaking(); };
            utterance.onerror = function () { finishSpeaking(); };

            synth.speak(utterance);

            // Safety Fallback (Prevents infinite talking animation bug)
            speechFallbackTimer = setInterval(() => {
                if (!synth.speaking) {
                    finishSpeaking();
                }
            }, 300);
        }

        function finishSpeaking() {
            clearInterval(speechFallbackTimer);
            if (!isSpeaking) return; 

            // Stop animations and hide subtitles
            mouth.classList.remove('talking');
            emoFace.classList.remove('speaking-mode');
            subtitleBox.classList.remove('show-subtitles');
            
            isSpeaking = false;
            resetIdleTimer();

            // Restart microphone automatically
            setTimeout(() => {
                if (recognition && !isSpeaking && !synth.speaking) {
                    try { recognition.start(); } catch(e) {}
                }
            }, 400);
        }

        // --- WAKE UP EVENT ---
        startOverlay.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            }
            startOverlay.style.display = 'none';

            if (recognition) {
                setTimeout(() => {
                    botSpeak("System online! Konektado na ang utak ko sa server. Kumusta?");
                }, 500);
            }
        });
    </script>
</body>
</html>
